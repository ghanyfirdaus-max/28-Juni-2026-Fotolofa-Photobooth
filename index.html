<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Little Memories ♡</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --paper: #fff8f5;
      --paper-dark: #f2ddd8;
      --pink: #d88998;
      --deep-pink: #8d3f50;
      --ink: #4b2a32;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.85), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(216,137,152,.22), transparent 30%),
        #ead0cc;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* =========================
       1. LOADING SCREEN
       ========================= */

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 40%, #fffaf8, #f4d9d8 75%);
      transition: opacity .9s ease, visibility .9s ease;
    }

    #loadingScreen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      animation: loadingFloat 2.4s ease-in-out infinite;
    }

    .loading-heart {
      font-size: 38px;
      color: var(--deep-pink);
      margin-bottom: 20px;
      animation: heartBeat 1.2s infinite;
    }

    .loading-title {
      font-size: clamp(26px, 6vw, 42px);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .loading-subtitle {
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: .55;
    }

    .loading-line {
      width: 150px;
      height: 2px;
      margin: 22px auto 0;
      overflow: hidden;
      background: rgba(141,63,80,.15);
    }

    .loading-line span {
      display: block;
      width: 45%;
      height: 100%;
      background: var(--deep-pink);
      animation: loadingLine 1.4s infinite ease-in-out;
    }

    @keyframes loadingLine {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
    }

    @keyframes loadingFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* =========================
       2. BOOK STAGE
       ========================= */

    #bookStage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      opacity: 0;
      transform: scale(.94);
      transition: opacity 1s ease, transform 1s ease;
    }

    #bookStage.ready {
      opacity: 1;
      transform: scale(1);
    }

    .book-area {
      position: relative;
      width: min(82vw, 390px);
      aspect-ratio: 3 / 4;
      height: auto;
      min-height: 0;
      max-height: 78vh;
      perspective: 1800px;
    }

    /* Shadow underneath the physical-looking book */
    .book-shadow {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: -12px;
      height: 35px;
      border-radius: 50%;
      background: rgba(72, 30, 40, .22);
      filter: blur(14px);
      transform: rotateX(70deg);
    }

    .book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    /* Every page occupies the whole book and turns around its left edge. */
    .page {
      position: absolute;
      inset: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition:
        transform .85s cubic-bezier(.2,.75,.2,1),
        box-shadow .85s ease;
      cursor: grab;
      user-select: none;
    }

    .page:active {
      cursor: grabbing;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .page-front,
    .page-back {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 4px 15px 15px 4px;
      background:
        linear-gradient(90deg, rgba(100,45,55,.10), transparent 7%),
        repeating-linear-gradient(
          0deg,
          rgba(120,70,60,.025) 0px,
          rgba(120,70,60,.025) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--paper);
      box-shadow:
        inset 8px 0 16px rgba(100,45,55,.10),
        8px 8px 20px rgba(80,35,45,.12);
      padding: 18px;
    }

    .page-back {
      transform: rotateY(180deg);
      border-radius: 15px 4px 4px 15px;
      background:
        linear-gradient(-90deg, rgba(100,45,55,.10), transparent 7%),
        var(--paper);
    }

    /* =========================
       3. COVER
       ========================= */

    .cover-page {
      padding: 0;
      background: #a94f61;
    }

    .cover-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .82;
    }

    .cover-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          to bottom,
          rgba(40,10,18,.12),
          rgba(40,10,18,.18) 45%,
          rgba(40,10,18,.72)
        );
    }

    .cover-frame {
      position: absolute;
      inset: 17px;
      border: 1px solid rgba(255,255,255,.65);
      pointer-events: none;
    }

    .cover-content {
      position: absolute;
      inset: auto 28px 35px;
      color: white;
      text-align: center;
      text-shadow: 0 2px 12px rgba(0,0,0,.35);
    }

    .cover-small {
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 5px;
      text-transform: uppercase;
      opacity: .9;
    }

    .cover-content h1 {
      margin: 13px 0 7px;
      font-size: clamp(42px, 11vw, 64px);
      line-height: .9;
      font-weight: normal;
    }

    .cover-content p {
      margin: 0;
      font-size: 15px;
      font-style: italic;
      opacity: .95;
    }

    .cover-date {
      margin-top: 14px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: .88;
    }

    /* =========================
       4. PHOTO PAGES
       ========================= */

    .photo-page {
      display: flex;
      flex-direction: column;
    }

    .photo-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 7px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(60,25,30,.12);
      transform: rotate(-.4deg);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background:
        linear-gradient(135deg, #f3dfe0, #fff8f5);
    }

    .photo-caption {
      flex: 0 0 auto;
      text-align: center;
      padding: 12px 5px 3px;
      font-size: 14px;
      font-style: italic;
      opacity: .75;
    }

    .page-number {
      position: absolute;
      right: 17px;
      bottom: 10px;
      font-family: Arial, sans-serif;
      font-size: 9px;
      opacity: .4;
      letter-spacing: 1px;
    }

    /* =========================
       5. CONTROLS
       ========================= */

    .hint {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 23px;
      transform: translateX(-50%);
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,248,245,.78);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 22px rgba(70,30,40,.12);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--deep-pink);
      transition: opacity .4s;
      white-space: nowrap;
    }

    .hint.hide {
      opacity: 0;
      pointer-events: none;
    }

    .page-counter {
      position: fixed;
      z-index: 30;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--deep-pink);
      opacity: .65;
    }

    .music-button {
      position: fixed;
      z-index: 40;
      right: 18px;
      bottom: 18px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: var(--deep-pink);
      color: white;
      font-size: 18px;
      box-shadow: 0 8px 22px rgba(80,25,40,.25);
      cursor: pointer;
    }



    /* AUTO SLIDE */
    .auto-slide-button {
      position: fixed;
      z-index: 40;
      right: 18px;
      bottom: 72px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,248,245,.92);
      color: var(--deep-pink);
      font-size: 17px;
      box-shadow: 0 8px 22px rgba(80,25,40,.18);
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .auto-slide-button:hover {
      transform: translateY(-2px);
    }

    .auto-slide-button.active {
      background: var(--deep-pink);
      color: white;
    }

    @media (max-height: 620px) {
      .book-area {
        width: min(82vw, 360px);
        max-height: 76vh;
      }
    }

    @media (min-width: 700px) {
      .book-area {
        width: min(48vw, 430px);
        aspect-ratio: 3 / 4;
        max-height: 82vh;
      }
    }

    /* =========================
       6. FINAL PAGE / CLOSE BOOK
       ========================= */

    .final-page {
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(216,137,152,.18), transparent 35%),
        var(--paper);
    }

    .final-message {
      max-width: 290px;
      margin: auto;
    }

    .final-heart {
      font-size: 42px;
      color: var(--deep-pink);
      margin-bottom: 12px;
    }

    .final-message h2 {
      margin: 0 0 10px;
      font-size: 31px;
      font-weight: normal;
      color: var(--deep-pink);
    }

    .final-message p {
      margin: 0 auto 25px;
      line-height: 1.7;
      font-size: 14px;
      opacity: .7;
    }

    .back-to-start {
      border: 1px solid rgba(141,63,80,.28);
      background: rgba(255,255,255,.7);
      color: var(--deep-pink);
      padding: 12px 19px;
      border-radius: 999px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(80,25,40,.10);
      transition: transform .2s ease, background .2s ease;
    }

    .back-to-start:hover {
      transform: translateY(-2px);
      background: #fff;
    }

    .book.closing {
      pointer-events: none;
    }

    .book.closing .page {
      transition:
        transform .42s cubic-bezier(.65,.05,.36,1),
        box-shadow .42s ease;
    }

  
    /* =========================
       LIGHTWEIGHT FLOATING PARTICLES
       ========================= */

    #particleLayer {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      font-size: 13px;
      line-height: 1;
      opacity: 0;
      will-change: transform, opacity;
      animation: particleFloat linear forwards;
    }

    .particle.heart {
      color: rgba(170, 58, 82, .72);
    }

    .particle.flower {
      color: rgba(190, 92, 108, .62);
      font-size: 12px;
    }

    @keyframes particleFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 18px, 0) rotate(0deg) scale(.75);
      }

      12% {
        opacity: .72;
      }

      50% {
        opacity: .62;
        transform: translate3d(var(--drift), -45vh, 0)
                   rotate(var(--rotate)) scale(1);
      }

      88% {
        opacity: .35;
      }

      100% {
        opacity: 0;
        transform: translate3d(calc(var(--drift) * -0.35), -105vh, 0)
                   rotate(calc(var(--rotate) * 1.4)) scale(.82);
      }
    }

    /* Pada perangkat yang meminta gerakan minim, matikan partikel. */
    @media (prefers-reduced-motion: reduce) {
      #particleLayer {
        display: none;
      }
    }

  
    /* =========================
       OPEN BOOK INTRO ANIMATION
       ========================= */
    #bookStage.intro-book {
      opacity: 1;
      transform: scale(.94);
    }

    #bookStage.intro-book .book {
      transform: scale(.96);
    }

    #bookStage.intro-book .page:first-child {
      transform: rotateY(-180deg);
    }

    #bookStage.opening-book .page:first-child {
      animation: openCoverFromLoading 1.25s cubic-bezier(.2,.72,.2,1) forwards;
    }

    #bookStage.opening-book .book {
      animation: bookSettle 1.25s cubic-bezier(.2,.72,.2,1) forwards;
    }

    @keyframes openCoverFromLoading {
      0% {
        transform: rotateY(-180deg);
      }
      55% {
        transform: rotateY(-92deg);
      }
      100% {
        transform: rotateY(0deg);
      }
    }

    @keyframes bookSettle {
      0% {
        transform: scale(.94);
      }
      55% {
        transform: scale(.985);
      }
      100% {
        transform: scale(1);
      }
    }

  </style>
</head>

<body>
  <!-- Lightweight floating particles -->
  <div id="particleLayer" aria-hidden="true"></div>


  <!-- =========================
       LOADING
       ========================= -->
  <div id="loadingScreen">
    <div class="loading-content">
      <div class="loading-heart">♡</div>
      <div class="loading-title">Memuat kenangan...</div>
      <div class="loading-subtitle">our little memories</div>
      <div class="loading-line"><span></span></div>
    </div>
  </div>

  <!-- =========================
       BOOK
       ========================= -->
  <main id="bookStage">

    <div class="book-area">
      <div class="book-shadow"></div>
      <div class="book" id="book"></div>
    </div>

  </main>

  <div class="page-counter" id="pageCounter">01 / 17</div>

  <div class="hint" id="hint">
    SWIPE ← UNTUK MEMBALIK HALAMAN
  </div>

  <!-- Musik nanti tinggal ganti file music.mp3 -->
  <audio id="music" loop src="music.mp3"></audio>

  <button class="music-button" id="musicButton" aria-label="Putar musik">
    ♫
  </button>

  <button class="auto-slide-button" id="autoSlideButton" aria-label="Putar otomatis" title="Auto slide">
    ▶
  </button>


  <script>
    /*
      ==========================================
      OUR LITTLE MEMORIES — 17 PAGE BOOK
      ==========================================

      STRUKTUR FOTO:

      foto01.jpeg  -> COVER
        foto02.jpeg
        foto03.jpeg
        ...
        foto48.jpeg

      Total sekarang: 1 cover + 15 foto isi + 1 halaman terakhir.
      Foto 01 dipakai sebagai cover.
    */

    const TOTAL_PAGES = 17;

    const book = document.getElementById("book");
    const counter = document.getElementById("pageCounter");
    const hint = document.getElementById("hint");

    let currentPage = 0;

    let autoSlide = false;
    let autoSlideTimer = null;
    const AUTO_SLIDE_DELAY = 2600;

    /*
      Membuat 17 lembar: 1 cover + 15 foto isi + 1 halaman terakhir.
      Setiap lembar punya:
      - front  = foto
      - back   = bagian belakang kertas

      Untuk tahap awal ini kita sengaja membuat
      satu foto = satu halaman.
    */
    for (let i = 1; i <= TOTAL_PAGES; i++) {

      const page = document.createElement("div");
      page.className = "page";
      page.dataset.page = i;

      const front = document.createElement("div");
      front.className = "page-front";

      if (i === 1) {
        /* COVER */
        front.classList.add("cover-page");

        front.innerHTML = `
          <img class="cover-photo"
               src="foto01.jpeg"
               alt="Our photobooth album"
               draggable="false">

          <div class="cover-overlay"></div>
          <div class="cover-frame"></div>

          <div class="cover-content">
            <div class="cover-small">You, Me, and Fotolofa</div>
            <h1>Our Photobooth<br>Album</h1>
            <p>♡ a collection of our moments ♡</p>
            <div class="cover-date">28 Juni 2026</div>
          </div>
        `;

      } else if (i === TOTAL_PAGES) {
        /* HALAMAN TERAKHIR */
        front.classList.add("photo-page", "final-page");

        front.innerHTML = `
          <div class="final-message">
            <div class="final-heart">♡</div>
            <h2>Sampai ketemu lagi.</h2>
            <p>
              Kenangan ini bisa dibuka kapan saja.
              Kalau mau mulai lagi dari awal, tutup bukunya dan buka kembali. ♡
            </p>

            <button class="back-to-start" id="backToStart">
              ↩ Tutup Buku
            </button>
          </div>

          <div class="page-number">
            ${String(i).padStart(2, "0")}
          </div>
        `;
      } else {
        /* FOTO BIASA */
        front.classList.add("photo-page");

        front.innerHTML = `
          <div class="photo-wrap">
            <img
              src="foto${String(i).padStart(2, "0")}.jpeg"
              alt="Memory ${i}"
              draggable="false"
            >
          </div>

          <div class="photo-caption">
            a little piece of us ♡
          </div>

          <div class="page-number">
            ${String(i).padStart(2, "0")}
          </div>
        `;
      }

      /* BAGIAN BELAKANG KERTAS */
      const back = document.createElement("div");
      back.className = "page-back";

      back.innerHTML = `
        <div style="
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          text-align:center;
          opacity:.28;
          font-size:13px;
          font-style:italic;
        ">
          Ganyuu ♡ Didunn
        </div>
      `;

      page.appendChild(front);
      page.appendChild(back);
      book.appendChild(page);
    }

    const pages = [...document.querySelectorAll(".page")];

    /*
      Page dengan nomor lebih besar harus berada
      di atas page yang lebih kecil.
    */
    pages.forEach((page, index) => {
      page.style.zIndex = TOTAL_PAGES - index;
    });


    /*
      ==========================================
      CLOSE BOOK → RETURN TO COVER
      ==========================================
    */

    let isClosing = false;

    function closeBookToCover() {
      if (isClosing || currentPage === 0) return;

      stopAutoSlide();
      isClosing = true;
      book.classList.add("closing");
      hint.classList.add("hide");

      /*
        Halaman dilipat kembali satu per satu dari belakang
        menuju cover supaya terasa seperti buku ditutup.
      */
      const pagesToClose = currentPage;

      for (let step = 0; step < pagesToClose; step++) {
        const pageIndex = currentPage - 1 - step;

        setTimeout(() => {
          pages[pageIndex].classList.remove("flipped");
        }, step * 55);
      }

      const totalCloseTime = Math.max(500, pagesToClose * 55 + 500);

      setTimeout(() => {
        currentPage = 0;
        updateCounter();
        book.classList.remove("closing");
        isClosing = false;
      }, totalCloseTime);
    }

    const backToStartButton = document.getElementById("backToStart");

    if (backToStartButton) {
      backToStartButton.addEventListener("click", (event) => {
        event.stopPropagation();
        closeBookToCover();
      });
    }


    /*
      ==========================================
      AUTO SLIDE
      ==========================================
    */

    const autoSlideButton = document.getElementById("autoSlideButton");

    function stopAutoSlide() {
      autoSlide = false;

      if (autoSlideTimer) {
        clearTimeout(autoSlideTimer);
        autoSlideTimer = null;
      }

      autoSlideButton.classList.remove("active");
      autoSlideButton.textContent = "▶";
      autoSlideButton.setAttribute("aria-label", "Putar otomatis");
    }

    function scheduleAutoSlide() {
      if (!autoSlide || isClosing) return;

      if (currentPage >= TOTAL_PAGES - 1) {
        stopAutoSlide();
        return;
      }

      autoSlideTimer = setTimeout(() => {
        autoSlideTimer = null;

        if (!autoSlide || isClosing) return;

        nextPage();

        if (autoSlide) {
          scheduleAutoSlide();
        }
      }, AUTO_SLIDE_DELAY);
    }

    function startAutoSlide() {
      if (currentPage >= TOTAL_PAGES - 1 || isClosing) return;

      autoSlide = true;
      autoSlideButton.classList.add("active");
      autoSlideButton.textContent = "Ⅱ";
      autoSlideButton.setAttribute("aria-label", "Matikan auto slide");

      scheduleAutoSlide();
    }

    autoSlideButton.addEventListener("click", (event) => {
      event.stopPropagation();

      if (autoSlide) {
        stopAutoSlide();
      } else {
        startAutoSlide();
      }
    });

    /*
      ==========================================
      PAGE TURN
      ==========================================
    */

    function nextPage() {
      if (isClosing) return false;
      if (currentPage >= TOTAL_PAGES - 1) {
        stopAutoSlide();
        return false;
      }

      pages[currentPage].classList.add("flipped");
      currentPage++;

      updateCounter();
      return true;
    }

    function previousPage() {
      if (isClosing) return;
      if (currentPage <= 0) return;

      currentPage--;
      pages[currentPage].classList.remove("flipped");

      updateCounter();
    }

    function updateCounter() {
      const shownPage = Math.min(currentPage + 1, TOTAL_PAGES);

      counter.textContent =
        String(shownPage).padStart(2, "0")
        + " / "
        + String(TOTAL_PAGES).padStart(2, "0");
    }


    /*
      ==========================================
      SWIPE HP
      ==========================================
    */

    let startX = 0;
    let startY = 0;

    book.addEventListener("touchstart", (event) => {
      stopAutoSlide();

      const touch = event.changedTouches[0];

      startX = touch.clientX;
      startY = touch.clientY;
    }, { passive: true });

    book.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];

      const diffX = touch.clientX - startX;
      const diffY = touch.clientY - startY;

      /*
        Hanya dianggap swipe kalau gerakan horizontal
        lebih besar daripada gerakan vertikal.
      */
      if (Math.abs(diffX) < 45) return;
      if (Math.abs(diffX) < Math.abs(diffY)) return;

      if (diffX < 0) {
        nextPage();
      } else {
        previousPage();
      }
    }, { passive: true });


    /*
      ==========================================
      MOUSE / DESKTOP
      ==========================================
    */

    let mouseDown = false;
    let mouseStartX = 0;

    book.addEventListener("mousedown", (event) => {
      stopAutoSlide();
      mouseDown = true;
      mouseStartX = event.clientX;
    });

    window.addEventListener("mouseup", (event) => {
      if (!mouseDown) return;

      mouseDown = false;

      const diff = event.clientX - mouseStartX;

      if (Math.abs(diff) < 45) return;

      if (diff < 0) {
        nextPage();
      } else {
        previousPage();
      }
    });


    /*
      Tombol keyboard untuk testing di laptop.
    */
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        stopAutoSlide();
      }

      if (event.key === "ArrowRight") nextPage();
      if (event.key === "ArrowLeft") previousPage();
    });


    /*
      ==========================================
      LOADING → BOOK
      ==========================================
    */

    window.addEventListener("load", () => {
      const loadingScreen = document.getElementById("loadingScreen");
      const bookStage = document.getElementById("bookStage");

      /*
        Buku awalnya berada dalam keadaan "tertutup".
        Cover dibuat ter-flip 180° hanya selama intro,
        lalu dibuka kembali ke posisi 0°.
      */
      bookStage.classList.add("intro-book");

      setTimeout(() => {
        loadingScreen.classList.add("hide");

        /* Tunggu sedikit setelah loading menghilang,
           lalu mulai membuka cover. */
        setTimeout(() => {
          bookStage.classList.remove("intro-book");
          bookStage.classList.add("ready", "opening-book");

          setTimeout(() => {
            bookStage.classList.remove("opening-book");
          }, 1300);
        }, 220);
      }, 1800);
    });


    /*
      Hilangkan petunjuk setelah halaman pertama dibalik.
    */
    book.addEventListener("touchend", () => {
      if (currentPage > 0) {
        hint.classList.add("hide");
      }
    });


    /*
      ==========================================
      MUSIC
      ==========================================
    */

    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", async () => {

      if (music.paused) {

        try {
          await music.play();
          musicButton.textContent = "Ⅱ";
        } catch (error) {
          alert(
            "Tambahkan file music.mp3 di folder yang sama dengan index.html."
          );
        }

      } else {

        music.pause();
        musicButton.textContent = "♫";

      }
    });

  
    /*
      ==========================================
      LIGHTWEIGHT FLOATING PARTICLES
      ==========================================

      Sengaja dibuat ringan:
      - hanya 10 partikel aktif maksimal
      - animasi ditangani CSS
      - JavaScript hanya membuat dan menghapus elemen
      - tidak memakai canvas, blur, atau shadow berat
    */

    const particleLayer = document.getElementById("particleLayer");
    const particleSymbols = ["♡", "✿", "❀"];
    let activeParticles = 0;
    const MAX_PARTICLES = 10;

    function createParticle() {
      if (!particleLayer || activeParticles >= MAX_PARTICLES) return;

      activeParticles++;

      const particle = document.createElement("span");
      const symbol =
        particleSymbols[Math.floor(Math.random() * particleSymbols.length)];

      particle.className =
        "particle " + (symbol === "♡" ? "heart" : "flower");

      particle.textContent = symbol;

      particle.style.left = (8 + Math.random() * 84) + "vw";
      particle.style.top = (88 + Math.random() * 12) + "vh";
      particle.style.setProperty(
        "--drift",
        ((Math.random() * 90) - 45) + "px"
      );
      particle.style.setProperty(
        "--rotate",
        ((Math.random() * 180) - 90) + "deg"
      );

      const duration = 8 + Math.random() * 5;
      particle.style.animationDuration = duration + "s";

      particleLayer.appendChild(particle);

      particle.addEventListener("animationend", () => {
        particle.remove();
        activeParticles--;
      }, { once: true });
    }

    /*
      Muncul pelan-pelan setiap ±1,4 detik.
      Jadi layar tidak pernah dipenuhi partikel.
    */
    setInterval(createParticle, 1400);

  </script>

</body>
</html>
